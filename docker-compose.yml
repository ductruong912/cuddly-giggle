# Two containers sharing the GPU: llama (recognition GGUF) + app (detection/layout + API).
# Models live in ./models, Paddle cache in ./.paddlex — mounted, not baked in.
# Needs NVIDIA Container Toolkit. Run: docker compose up --build
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      -m /models/PaddleOCR-VL-1.6-GGUF.gguf
      --mmproj /models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMA_CTX_SIZE:-4096}
      --parallel 1
      --n-gpu-layers ${LLAMA_N_GPU_LAYERS:-20}
      --mmproj-offload
      --flash-attn on
      --threads 4 --threads-batch 4
      --temp 0 -lv 1
    volumes:
      - ./models:/models:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build:
      context: .
      args:
        CUDA_TAG: ${CUDA_TAG:-12.6.3-cudnn-runtime-ubuntu22.04}
        PADDLE_INDEX: ${PADDLE_INDEX:-https://www.paddlepaddle.org.cn/packages/stable/cu126/}
    depends_on:
      llama:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      OCR_DEVICE: gpu:0
      PADDLEOCR_VL_USE_GGUF: "true"
      LLAMA_SERVER_AUTOSTART: "false"
      PADDLEOCR_VL_REC_BACKEND: llama-cpp-server
      PADDLEOCR_VL_REC_SERVER_URL: http://llama:8080/v1
      PADDLEOCR_VL_REC_MAX_CONCURRENCY: "1"
      PADDLEOCR_VL_REC_API_MODEL_NAME: paddleocr-vl
      PADDLE_PDX_CACHE_HOME: /app/.paddlex
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "true"
      # llama runs --parallel 1, so a second concurrent OCR request only queues.
      OCR_MAX_CONCURRENCY: "${OCR_MAX_CONCURRENCY:-2}"
      LLM_MAX_CONCURRENCY: "${LLM_MAX_CONCURRENCY:-8}"
      STAGE_QUEUE_TIMEOUT_SECONDS: "${STAGE_QUEUE_TIMEOUT_SECONDS:-30}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-52428800}"
      PDF_MAX_PAGES: "${PDF_MAX_PAGES:-100}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DATALAB_API_KEY: "${DATALAB_API_KEY:-}"
    volumes:
      - ./models:/app/models:ro
      - ./.paddlex:/app/.paddlex
      - ./outputs:/app/outputs
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3.11 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
