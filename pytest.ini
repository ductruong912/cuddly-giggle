[pytest]
testpaths = tests
# The suite imports first-party packages (api, core, services, eval) by name, so
# the repo root has to be importable. pytest only adds the test directory itself.
pythonpath = .
addopts = --strict-markers --tb=short
markers =
    slow: exercises real timing behaviour and takes seconds rather than milliseconds
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
